<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Trocas – Álbum P2P</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Voltar</a>
        <h2>🤝 Central de Trocas</h2>

        <!-- Formulário: enviar proposta -->
        <div class="card">
            <h3>Enviar Proposta de Troca</h3>
            <p class="hint">Use após encontrar um nó com <strong>SEARCH_HIT</strong> na tela de busca.</p>
            <div class="form-group">
                <label for="target-peer">ID do Nó Destino (ex: ALUNO-01)</label>
                <input type="text" id="target-peer" placeholder="ALUNO-XX">
            </div>
            <div class="form-group">
                <label for="offer-sticker">Figurinha que você vai OFERECER (ex: FIG-22)</label>
                <input type="text" id="offer-sticker" placeholder="FIG-XX">
            </div>
            <div class="form-group">
                <label for="want-sticker">Figurinha que você QUER receber (ex: FIG-01)</label>
                <input type="text" id="want-sticker" placeholder="FIG-XX">
            </div>
            <button class="btn" id="btn-enviar" onclick="enviarProposta()">📤 Enviar Proposta</button>
            <p id="status-envio" class="status-msg"></p>
        </div>

        <!-- Propostas recebidas aguardando decisão -->
        <div class="card">
            <h3>Propostas Recebidas <span id="badge-pendentes" class="badge badge-pending">0</span></h3>
            <ul id="propostas-recebidas" class="sticker-list">
                <li class="empty-msg">Nenhuma proposta pendente no momento.</li>
            </ul>
        </div>

        <!-- Log de notificações -->
        <div class="card">
            <h3>Log de Atividades</h3>
            <ul id="log-atividades" class="log-list">
                <li class="empty-msg">Aguardando atividade...</li>
            </ul>
        </div>
    </div>

    <script>
        // ── Enviar proposta ───────────────────────────────────
        async function enviarProposta() {
            const peer          = document.getElementById('target-peer').value.trim();
            const offerSticker  = document.getElementById('offer-sticker').value.trim().toUpperCase();
            const wantSticker   = document.getElementById('want-sticker').value.trim().toUpperCase();
            const statusEl      = document.getElementById('status-envio');

            if (!peer || !offerSticker || !wantSticker) {
                statusEl.textContent = '⚠️ Preencha todos os campos!';
                statusEl.className = 'status-msg error';
                return;
            }

            try {
                const res = await fetch('/api/trade/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        target_peer: peer,
                        offer_sticker_id: offerSticker,
                        want_sticker_id: wantSticker
                    })
                });
                const data = await res.json();
                if (data.success) {
                    statusEl.textContent = `✅ Proposta enviada para ${peer}!`;
                    statusEl.className = 'status-msg success';
                    document.getElementById('target-peer').value = '';
                    document.getElementById('offer-sticker').value = '';
                    document.getElementById('want-sticker').value = '';
                } else {
                    statusEl.textContent = '❌ Erro ao enviar proposta.';
                    statusEl.className = 'status-msg error';
                }
            } catch (err) {
                statusEl.textContent = '❌ Falha de conexão com o servidor.';
                statusEl.className = 'status-msg error';
                console.error(err);
            }
        }

        // ── Responder a proposta ──────────────────────────────
        async function responderProposta(peerId, acao) {
            try {
                const res = await fetch(`/api/trade/${acao}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ peer_id: peerId })
                });
                const data = await res.json();
                const msg = acao === 'accept'
                    ? `✅ Proposta de ${peerId} ACEITA! Inventário atualizado.`
                    : `❌ Proposta de ${peerId} RECUSADA.`;
                alert(msg);
                verificarPropostas(); // Atualiza imediatamente
            } catch (err) {
                console.error(err);
                alert('Falha de conexão com o servidor.');
            }
        }

        // ── Polling: propostas pendentes ──────────────────────
        async function verificarPropostas() {
            try {
                const res = await fetch('/api/trade/pending');
                const propostas = await res.json();
                const lista = document.getElementById('propostas-recebidas');
                const badge = document.getElementById('badge-pendentes');

                badge.textContent = propostas.length;
                badge.className = propostas.length > 0
                    ? 'badge badge-pending active'
                    : 'badge badge-pending';

                if (propostas.length > 0) {
                    lista.innerHTML = propostas.map(p => `
                        <li class="proposta-item">
                            <div class="proposta-info">
                                <strong>${p.sender_peer_id}</strong> oferece
                                <span class="sticker-tag">${p.offer_sticker_id}</span>
                                e quer
                                <span class="sticker-tag">${p.want_sticker_id}</span>
                            </div>
                            <div class="proposta-actions">
                                <button class="btn btn-sm btn-accept"
                                    onclick="responderProposta('${p.sender_peer_id}', 'accept')">
                                    ✅ Aceitar
                                </button>
                                <button class="btn btn-sm btn-reject"
                                    onclick="responderProposta('${p.sender_peer_id}', 'reject')">
                                    ❌ Recusar
                                </button>
                            </div>
                        </li>
                    `).join('');
                } else {
                    lista.innerHTML = '<li class="empty-msg">Nenhuma proposta pendente no momento.</li>';
                }
            } catch (e) { /* silencia erros de rede */ }
        }

        // ── Polling: log de notificações ──────────────────────
        async function verificarNotificacoes() {
            try {
                const res = await fetch('/api/notifications');
                const logs = await res.json();
                const logEl = document.getElementById('log-atividades');

                if (logs.length > 0) {
                    logEl.innerHTML = logs.slice(0, 20).map(n =>
                        `<li class="log-item"><span class="log-time">${n.time}</span> ${n.text}</li>`
                    ).join('');
                } else {
                    logEl.innerHTML = '<li class="empty-msg">Aguardando atividade...</li>';
                }
            } catch (e) { /* silencia erros de rede */ }
        }

        // Polling a cada 2 segundos
        setInterval(verificarPropostas, 2000);
        setInterval(verificarNotificacoes, 2000);

        // Carrega imediatamente
        verificarPropostas();
        verificarNotificacoes();
    </script>
</body>
</html>
