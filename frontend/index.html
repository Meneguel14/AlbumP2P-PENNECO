<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum P2P</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="hero">
            <div class="hero-sticker">
                <img src="" alt="Carregando..." class="sticker-hero-img" id="hero-img">
            </div>
            <div class="hero-info">
                <p class="node-label">Nó Ativo</p>
                <h1 id="node-id">Carregando...</h1>
                <p class="hero-sub" id="hero-sub">Buscando informações do nó...</p>
            </div>
        </header>

        <nav class="menu">
            <a href="inventario.html" class="btn">
                <span class="btn-icon">📦</span>
                <span>Meu Inventário</span>
            </a>
            <a href="busca.html" class="btn">
                <span class="btn-icon">🔍</span>
                <span>Buscar Figurinhas</span>
            </a>
            <a href="trocas.html" class="btn">
                <span class="btn-icon">🤝</span>
                <span>Central de Trocas</span>
            </a>
        </nav>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Faz a requisição para a rota que criamos no backend
            fetch('/api/config')
                .then(response => {
                    if (!response.ok) throw new Error('Erro na resposta do servidor');
                    return response.json();
                })
                .then(data => {
                    // 1. Atualiza o título da aba do navegador
                    document.title = `Álbum P2P – Nó ${data.nodeId}`;
                    
                    // 2. Atualiza o ID do Aluno principal (ex: ALUNO-17 ou ALUNO-22)
                    document.getElementById('node-id').textContent = data.nodeId;
                    
                    // 3. Atualiza a imagem da figurinha do topo correspondente ao nó ativo
                    const heroImg = document.getElementById('hero-img');
                    heroImg.src = `/api/sticker-image/${data.minhaFigurinha}`;
                    heroImg.alt = `Figurinha ${data.minhaFigurinha}`;
                    
                    // 4. Atualiza o texto descritivo secundário abaixo do título
                    document.getElementById('hero-sub').textContent = `Nó Autoral · ${data.minhaFigurinha} · Álbum P2P`;
                })
                .catch(err => {
                    console.error('Erro ao carregar as configurações locais:', err);
                    document.getElementById('node-id').textContent = 'Erro de Conexão';
                    document.getElementById('hero-sub').textContent = 'Não foi possível ler o config.js';
                });
        });
    </script>
</body>
</html>
