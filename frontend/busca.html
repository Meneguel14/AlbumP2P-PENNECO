<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar na Rede - Álbum P2P</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Voltar</a>
        <h2>🔍 Buscar Figurinhas na Rede</h2>

        <div class="form-group">
            <label for="sticker-id">ID da Figurinha (ex: FIG-05):</label>
            <input type="text" id="sticker-id" placeholder="FIG-XX">
            <button class="btn" id="btn-buscar" onclick="iniciarBusca()">Iniciar Busca (Flooding)</button>
        </div>

        <div class="card">
            <h3>Resultados da Busca</h3>
            <div id="resultados-busca">
                <p class="empty-msg">Nenhuma busca em andamento...</p>
            </div>
        </div>

        <div class="card">
            <h3>Log de Atividades da Rede</h3>
            <ul id="log-atividades" class="log-list">
                <li class="empty-msg">Aguardando atividade...</li>
            </ul>
        </div>
    </div>

    <script>
        // TTL no servidor é 7 saltos. Estimamos ~1s por salto + 1s de margem = 8s.
        const TTL_TIMEOUT_MS = 8000;

        const wsUrl = `ws://${location.host}`;
        let ws;
        let buscandoId    = null;
        let hitEncontrado = false;
        let ttlTimer      = null;
        let progressTimer = null;

        function conectarWS() {
            ws = new WebSocket(wsUrl);
            ws.onopen = () => console.log('[WS] Conectado ao backend.');

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'INIT') {
                    renderLog(data.notifications || []);
                } else if (data.type === 'NOTIFICATION') {
                    adicionarLog(data.notification);
                    // Verifica se é um HIT para a busca atual
                    if (buscandoId &&
                        data.notification.text.includes('[HIT]') &&
                        data.notification.text.toUpperCase().includes(buscandoId.toUpperCase())) {
                        hitEncontrado = true;
                        clearTimeout(ttlTimer);
                        clearInterval(progressTimer);
                        mostrarHit(data.notification);
                        encerrarBusca(true);
                    }
                }
            };

            ws.onclose = () => {
                console.log('[WS] Desconectado. Reconectando em 3s...');
                setTimeout(conectarWS, 3000);
            };
            ws.onerror = () => ws.close();
        }

        conectarWS();

        // ── Inicia a busca na rede ────────────────────────────────
        async function iniciarBusca() {
            const stickerId = document.getElementById('sticker-id').value.trim().toUpperCase();
            if (!stickerId) return alert('Digite o ID da figurinha!');

            // Limpa estado anterior
            clearTimeout(ttlTimer);
            clearInterval(progressTimer);
            buscandoId    = stickerId;
            hitEncontrado = false;

            const btn  = document.getElementById('btn-buscar');
            const area = document.getElementById('resultados-busca');
            const totalSec = TTL_TIMEOUT_MS / 1000;

            btn.disabled    = true;
            btn.textContent = `Buscando... (0/${totalSec}s)`;
            area.innerHTML  = `<p>Procurando por <strong>${stickerId}</strong> na rede...
                                <span id="ttl-countdown">(TTL: 7 saltos — aguardando resposta)</span></p>
                               <ul id="lista-hits"></ul>`;

            // Timer de progresso visual (atualiza a cada 1s)
            let elapsed = 0;
            progressTimer = setInterval(() => {
                elapsed++;
                const span = document.getElementById('ttl-countdown');
                if (span) span.textContent = `(${elapsed}s / ${totalSec}s)`;
                btn.textContent = `Buscando... (${elapsed}/${totalSec}s)`;
            }, 1000);

            // Timer do TTL — se não chegar HIT no tempo estimado, encerra com "não encontrado"
            ttlTimer = setTimeout(() => {
                clearInterval(progressTimer);
                if (!hitEncontrado) encerrarBusca(false);
            }, TTL_TIMEOUT_MS);

            try {
                await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sticker_id: stickerId })
                });
            } catch (err) {
                clearInterval(progressTimer);
                clearTimeout(ttlTimer);
                encerrarBusca(false);
                console.error('Erro ao disparar busca:', err);
            }
        }

        function encerrarBusca(encontrou) {
            const btn = document.getElementById('btn-buscar');
            btn.disabled    = false;
            btn.textContent = 'Iniciar Busca (Flooding)';

            if (!encontrou) {
                const area = document.getElementById('resultados-busca');
                area.innerHTML = `<p style="color:#f87171;">
                    ⚠️ Figurinha <strong>${buscandoId}</strong> não encontrada na rede
                    (TTL de 7 saltos esgotado sem resposta).
                </p>`;
                buscandoId = null;
            }
        }

        function mostrarHit(notif) {
            const listaHits = document.getElementById('lista-hits');
            if (listaHits) {
                const li = document.createElement('li');
                li.style.cssText = 'color:#4ade80; padding:.4rem 0;';
                li.innerHTML = `✅ [${notif.time}] ${notif.text}`;
                listaHits.appendChild(li);
            }
        }

        // ── Log de atividades ─────────────────────────────────────
        function renderLog(logs) {
            const logEl = document.getElementById('log-atividades');
            if (logs.length > 0) {
                logEl.innerHTML = logs.slice(0, 30).map(n =>
                    `<li class="log-item"><span class="log-time">${n.time}</span> ${n.text}</li>`
                ).join('');
            }
        }

        function adicionarLog(n) {
            const logEl = document.getElementById('log-atividades');
            const emptyMsg = logEl.querySelector('.empty-msg');
            if (emptyMsg) emptyMsg.remove();
            const li = document.createElement('li');
            li.className = 'log-item';
            li.innerHTML = `<span class="log-time">${n.time}</span> ${n.text}`;
            logEl.prepend(li);
            while (logEl.children.length > 30) logEl.lastChild.remove();
        }
    </script>
</body>
</html>
